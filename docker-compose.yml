services:
  postgres:
    image: postgres:16-alpine
    container_name: airgo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: airgo
      POSTGRES_USER: airgo
      # Same variable the backend reads, so both sides stay in sync.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airgo -d airgo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
