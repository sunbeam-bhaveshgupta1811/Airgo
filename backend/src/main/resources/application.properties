spring.application.name=airline

# Show full error details
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.timeout=5000


server.port=8080
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# PostgreSQL. Note two differences from the previous MySQL setup:
#  - There is no createDatabaseIfNotExist equivalent: the "airgo" database must already
#    exist before the application starts (docker-compose.yml creates it locally).
#  - Managed providers (Render/Heroku/Railway) inject DATABASE_URL in libpq form
#    (postgresql://user:pass@host/db), which is NOT a valid JDBC URL and will fail at
#    startup with "Driver claims to not accept jdbcUrl". Set SPRING_DATASOURCE_URL to
#    jdbc:postgresql://host:5432/dbname explicitly, with credentials as separate vars.
#  - The old MySQL URL carried useSSL=true. PostgreSQL's JDBC driver only *prefers* TLS by
#    default, so production must append ?sslmode=require (or verify-full) to keep the same
#    guarantee. Left off the localhost default because local Postgres has no TLS.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/airgo}
spring.datasource.username=${DATABASE_USERNAME:airgo}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Dialect is auto-detected from the driver on Spring Boot 3; set explicitly for clarity.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# One-time admin bootstrap. Leave unset to disable POST /api/auth/create-admin entirely.
# Set it only while creating the first admin account, then remove it from the environment.
app.admin-bootstrap-secret=${ADMIN_BOOTSTRAP_SECRET:}

# Exact browser origins allowed to call this API. Comma-separated, no wildcards:
# credentialed CORS against shared hosts like *.vercel.app trusts every tenant on them.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

logging.level.com.airline.reservation=INFO
logging.level.org.springframework.security=WARN

# Kafka Configuration (set to true only when Kafka is running)
app.kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=airline-notification-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.airline.reservation.event
spring.kafka.consumer.auto-offset-reset=earliest

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=5000

# Flight search cache TTL in minutes
app.cache.flight-search-ttl=5




CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}